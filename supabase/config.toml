# Supabase project configuration for Pillow Thief.
# Local development: `supabase start`, `supabase db reset` (applies migrations + seed).
# Deploy migrations: `supabase db push`. Deploy functions: `supabase functions deploy`.

project_id = "pillow-thief"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["pillowthief://auth-callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"

[analytics]
enabled = false
